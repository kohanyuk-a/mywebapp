version: '3.9'

services:

  db:
    image: postgres:14
    container_name: mywebapp-db

    environment:
      POSTGRES_DB: mywebapp
      POSTGRES_USER: mywebapp
      POSTGRES_PASSWORD: mywebapp

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - mynetwork

  web:
    build: .
    container_name: mywebapp-web

    depends_on:
      - db

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mywebapp
      SPRING_DATASOURCE_USERNAME: mywebapp
      SPRING_DATASOURCE_PASSWORD: mywebapp

    networks:
      - mynetwork

  nginx:
    image: nginx:latest
    container_name: mywebapp-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - web

    networks:
      - mynetwork

networks:
  mynetwork:

volumes:
  postgres_data: